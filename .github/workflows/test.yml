name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.2.4'
          - python: '3.14'
            homeassistant: '2026.9.4'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: python -m pip install homeassistant==${{ matrix.homeassistant }} pytest pytest-asyncio ruff==0.14.10
      - run: go test -race ./...
        working-directory: agent
      - run: sh scripts/build-agent
      - run: KIDSSTATION_AGENT_BINARY="$PWD/dist/kidsstation-agent-linux-amd64" python -m pytest -q
      - run: python -m ruff check . && python -m ruff format --check .
