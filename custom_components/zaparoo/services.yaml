launch:
  name: Launch token
  description: Emulate scanning a Zaparoo token.
  fields:
    device_id:
      name: Device
      description: Target Zaparoo device
      required: true
      selector:
        device:
          integration: zaparoo

    type:
      name: Token type
      description: Optional internal token category (used for logging).
      example: nfc
      selector:
        text:

    text:
      name: Token text
      description: >
        Main token text containing ZapScript
        (e.g. **launch.title:SNES/Super Mario World)
      example: "**launch.title:SNES/Super Mario World"
      selector:
        text:

    data:
      name: Raw token data
      description: >
        Raw token data as a hexadecimal string.
        Used for mappings and NFC toy detection.
      example: "04A224BCFF12"
      selector:
        text:

    unsafe:
      name: Allow unsafe operations
      description: Allow unsafe ZapScript operations.
      default: false
      selector:
        boolean:

stop:
  name: Stop launcher
  description: Kill any active launcher, if supported.
  fields:
    device_id:
      name: Device
      description: Target Zaparoo device
      required: true
      selector:
        device:
          integration: zaparoo

media:
  name: Media query
  description: Return current media state and database info.
  fields:
    device_id:
      name: Device
      description: Target Zaparoo device
      required: true
      selector:
        device:
          integration: zaparoo

switch_profile:
  name: Switch profile
  description: Activate a Zaparoo profile; its PIN is required when configured.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zaparoo
    profile_id:
      selector:
        text:
    person:
      selector:
        entity:
          domain: person
    pin:
      selector:
        text:
          type: password

add_time:
  name: Add bonus time
  description: Add minutes to today's combined allowance; expires at local midnight.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zaparoo
    profile_id:
      selector:
        text:
    person:
      selector:
        entity:
          domain: person
    minutes:
      required: true
      default: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min

set_schedule:
  name: Set weekly schedule
  description: Set exactly seven daily minute values, Monday to Sunday; zero blocks a day.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zaparoo
    profile_id:
      selector:
        text:
    person:
      selector:
        entity:
          domain: person
    minutes:
      required: true
      example: [60, 60, 90, 60, 90, 120, 120]
      selector:
        object:
    enabled:
      default: true
      selector:
        boolean:
