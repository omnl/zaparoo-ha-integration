# Replace these entity IDs with the IDs created in your Home Assistant instance.
type: vertical-stack
cards:
  - type: entities
    title: KidsStation
    entities:
      - binary_sensor.kidsstation_connection
      - sensor.kidsstation_active_profile
      - sensor.kidsstation_media
      - sensor.kidsstation_media_category
      - sensor.kidsstation_media_time_today
      - sensor.kidsstation_daily_time_remaining
  - type: entities
    title: Dein Kind
    entities:
      - person.dein_kind
      - sensor.dein_kind_daily_allowance
      - sensor.dein_kind_bonus_today
  - type: horizontal-stack
    cards:
      - type: button
        entity: button.dein_kind_add_15_minutes
        name: +15 min
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dein_kind_add_15_minutes
      - type: button
        entity: button.dein_kind_add_30_minutes
        name: +30 min
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dein_kind_add_30_minutes
      - type: button
        entity: button.dein_kind_add_60_minutes
        name: +60 min
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dein_kind_add_60_minutes
